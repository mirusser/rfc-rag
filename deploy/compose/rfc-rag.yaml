# deploy/compose/rfc-rag.yaml
# Standalone RFC RAG MCP server with pgvector PostgreSQL.
#
# Prerequisites:
#   1. RFC mirror on the host (one-time):
#        rsync -avz --delete rsync.rfc-editor.org::rfcs-text-only ~/rfc-mirror/
#   2. OpenRouter API key
#
# Run (after creating .env.rfc-rag at repo root):
#   cp deploy/compose/rfc-rag.env.example .env.rfc-rag
#   # edit .env.rfc-rag with your settings
#   docker compose --env-file .env.rfc-rag -f deploy/compose/rfc-rag.yaml up
#
# First run indexes all ~9800 RFCs (10-15 min). Subsequent starts are fast
# (SHA256-based incremental indexing).
#
# Connect Claude Code / Codex CLI:
#   claude mcp add-json --scope user rfc-rag \
#     '{"type":"stdio","command":"docker","args":["exec","-i","rfc-rag-rfc-rag-1","dotnet","RfcRag.dll"]}'

name: rfc-rag

services:
  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - ${RFC_RAG_ENV_FILE:-../../.env.rfc-rag}
    ports:
      - "${PG_BIND_ADDRESS:-127.0.0.1}:${PG_BIND_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-rfc_rag} -d ${PG_DATABASE:-rfc_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rfc-rag:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    env_file:
      - ${RFC_RAG_ENV_FILE:-../../.env.rfc-rag}
    volumes:
      - ${RFC_MIRROR_HOST_PATH:-/home/user/rfc-mirror}:/rfc-mirror:ro
    restart: unless-stopped

volumes:
  pgdata:
