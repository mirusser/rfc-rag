# Publish the rfc-rag dotnet global tool to nuget.org and GitHub Packages.
#
# Triggered by a v* tag push or manual dispatch.
# Uses NuGet Trusted Publishing (OIDC) — no long-lived API key secret required.
# One-time setup: configure a Trusted Publishing policy on nuget.org for this repo
# (nuget.org → account → Trusted Publishing → add policy → workflow: release.yml)
#
# Install after publish:
#   dotnet tool install -g rfc-rag

name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 1.2.3) — required for manual dispatch"
        required: false
        default: ""

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-nuget:
    name: Pack & Publish NuGet
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::No version determined. Push a v* tag or set the version input."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore RfcRag.slnx

      - name: Build solution
        run: dotnet build RfcRag.slnx --no-restore --configuration Release

      - name: Pack NuGet tool
        run: >
          dotnet pack src/RfcRag/RfcRag.csproj
          --no-build --configuration Release
          -o ./nupkg
          -p:PackageVersion=${{ env.VERSION }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ env.VERSION }}
          path: ./nupkg/*
          retention-days: 7

      - name: Authenticate with nuget.org (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ github.repository_owner }}
          token-service-url: https://www.nuget.org/api/v2/token
          audience: https://www.nuget.org

      - name: Publish to nuget.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
