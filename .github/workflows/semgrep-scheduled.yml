# Semgrep Full Scan (Scheduled)
#
# Generated for ci-cd-architect standard v1.2.0, Rule CI-CDW-50.
# Daily at 03:00 UTC + manual trigger. Same rules as PR scan but full repository.
# Catches issues introduced by newly published Semgrep rules without requiring a PR.

name: Semgrep Full Scan (Scheduled)

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: semgrep-full
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semgrep-full:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Semgrep Full Scan
        id: semgrep
        env:
          SEMGREP_RULES: p/auto p/secrets p/owasp-top-ten
        run: |
          python3 -m pip install semgrep==1.165.0
          semgrep ci --config p/auto --config p/secrets --config p/owasp-top-ten

      - name: Upload SARIF to GitHub Security
        id: upload-sarif
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-full

      - name: Warn if SARIF upload failed
        if: always() && steps.upload-sarif.outcome == 'failure'
        run: echo "::warning::SARIF upload failed — check codeql-action reference or permissions"
