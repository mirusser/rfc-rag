# .NET CI — Quality Gate for RFC RAG
#
# Generated for ci-cd-architect standard v1.2.0.
# Archetype: .NET + MCP + Docker
#
# Sequence: restore → format → build → test + coverage → pack (on tag)
#           → docker-smoke (health + tool count)
#           → NuGet vulnerability scan

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Build, Test & Coverage
  # ──────────────────────────────────────────────────────────
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Print .NET environment info
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-

      - name: Restore dependencies
        run: dotnet restore RfcRag.slnx

      - name: Verify code formatting
        run: dotnet format RfcRag.slnx --no-restore --verify-no-changes

      - name: Build (with analyzers)
        run: dotnet build RfcRag.slnx --no-restore --configuration Release

      - name: Unit tests + coverage
        run: |
          dotnet test RfcRag.slnx \
            --no-build \
            --configuration Release \
            --filter "Category!=Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger trx

      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.0 || true

      - name: Generate coverage report
        if: always()
        continue-on-error: true
        run: |
          reportgenerator \
            -reports:"**/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;MarkdownSummaryGithub;Badges;JsonSummary" \
            -assemblyfilters:"+RfcRag*" \
            -verbosity:Warning

      - name: Publish test results to PR
        if: always() && hashFiles('TestResults/**/*.trx') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Unit Tests
          path: "TestResults/**/*.trx"
          reporter: dotnet-trx

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: |
            TestResults/
            coverage-report/
          retention-days: 14

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request' && always() && hashFiles('coverage-report/SummaryGithub.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: coverage-report/SummaryGithub.md

  # ──────────────────────────────────────────────────────────
  # Job 2: Docker Smoke Test (MCP)
  # ──────────────────────────────────────────────────────────
  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rfc_rag
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t rfc-rag:test .

      - name: Enable pgvector extension
        run: |
          apt-get update && apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d rfc_rag \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Smoke — verify server starts
        run: |
          # Pipe sleep to keep stdin open; MCP stdio server exits on stdin EOF
          sleep 60 | docker run -i --name rfc-rag-smoke --network host \
            -e RfcRag__PostgresConnectionString="Host=localhost;Database=rfc_rag;Username=postgres;Password=postgres" \
            -e RfcRag__RfcMirrorPath=/nonexistent \
            -e RfcRag__EmbeddingBatchSize=1 \
            -e RfcRag__OpenRouterEmbeddingEndpoint=https://httpstat.us/200 \
            rfc-rag:test &
          sleep 8
          if docker inspect -f '{{.State.Running}}' rfc-rag-smoke 2>/dev/null | grep -q true; then
            echo "✅ MCP server started successfully"
            docker stop rfc-rag-smoke 2>/dev/null || true
          else
            echo "❌ MCP server failed to start"
            docker logs rfc-rag-smoke 2>&1 || true
            exit 1
          fi

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f rfc-rag-smoke 2>/dev/null || true

  # ──────────────────────────────────────────────────────────
  # Job 3: NuGet Vulnerability Scan
  # ──────────────────────────────────────────────────────────
  nuget-vuln-scan:
    name: NuGet Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore RfcRag.slnx

      - name: Scan for known vulnerabilities
        run: |
          dotnet list RfcRag.slnx package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Critical or high-severity vulnerabilities found"
            exit 1
          fi
          echo "::notice::No known NuGet vulnerabilities found"

  # ──────────────────────────────────────────────────────────
  # Job 4: Pack & Publish (tag only)
  # ──────────────────────────────────────────────────────────
  pack-publish:
    name: Pack & Publish
    needs: [build-and-test, docker-smoke, nuget-vuln-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Extract clean version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore RfcRag.slnx

      - name: Build solution
        run: dotnet build RfcRag.slnx --no-restore --configuration Release

      - name: Pack NuGet packages
        run: dotnet pack RfcRag.slnx --no-build --configuration Release -o ./nupkg -p:PackageVersion=${{ env.VERSION }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nupkg/*
          retention-days: 1

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate

      - name: Extract release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk '/^## \['"${VERSION}"'\]/{flag=1; next} /^## \[/{if(flag) exit} flag' CHANGELOG.md > release_notes.md || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: ./nupkg/*
          generate_release_notes: true
          make_latest: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
